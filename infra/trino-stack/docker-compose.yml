services:
  # ── PostgreSQL (Iceberg JDBC catalog backend) ──────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: trino-postgres
    environment:
      POSTGRES_USER: trino
      POSTGRES_PASSWORD: trino
      POSTGRES_DB: iceberg_catalog
    ports:
      - "5433:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trino -d iceberg_catalog"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ── MinIO (S3-compatible storage for Iceberg data) ─────────────────────────
  minio:
    image: minio/minio:latest
    container_name: trino-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Create MinIO buckets ───────────────────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: trino-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb local/warehouse --ignore-existing &&
      echo 'Bucket created'
      "

  # ── Trino (single-node, Iceberg JDBC catalog) ─────────────────────────────
  trino:
    image: trinodb/trino:latest
    container_name: trino
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8085:8080"
    volumes:
      - ./etc/catalog:/etc/trino/catalog:ro
      - ./etc/jvm.config:/etc/trino/jvm.config:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  pg-data:
  minio-data:
