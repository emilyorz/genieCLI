[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genie-cli"
version = "5.0.0"
description = "AI-powered Trino query tuning CLI"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
    "urllib3>=1.26.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "prompt_toolkit>=3.0.0",
    "pyyaml>=6.0",
    "sqlglot>=23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "responses>=0.23.0",
]
toml = [
    "tomli>=2.0;python_version<'3.11'",
]
tgenie-auth = [
    "websocket-client>=1.6.0",
]

[project.scripts]
genie = "genie.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["genie*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py310"
